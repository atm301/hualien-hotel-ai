<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>講師後台｜花蓮觀光旅宿 AI 專班 Day 1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0f8a86;--teal-d:#0a6b68;--sun:#ef8a3d;--sun-d:#d2701f;--deep:#13303a;
  --ink:#13303a;--mute:#64808a;--bg:#f3f8f8;--bg2:#fff;--line:#d9e9e8;--tint:#e6f5f4;
  --red:#d2483a;--green:#1f8a62;--blue:#2a7fb8}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;padding-bottom:60px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:var(--deep);color:#fff;padding:14px 0;position:sticky;top:0;z-index:20}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:1.05rem;font-weight:900}
header .sub{font-size:.76rem;opacity:.8;display:block;font-weight:400}
header .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,button,textarea{font-family:inherit;font-size:.9rem}
.inp{border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:#fff;color:var(--ink)}
.btn{border:0;border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;background:var(--teal);color:#fff}
.btn.g{background:#fff;color:var(--teal-d);border:1px solid var(--line)}
.btn.o{background:var(--sun)}
.btn.r{background:var(--red)}
.btn.sm{padding:5px 12px;font-size:.8rem}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:12px 0 2px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--mute);border-radius:999px;padding:7px 15px;font-weight:800;cursor:pointer}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
section{display:none;padding:14px 0 40px}
section.on{display:block}
h2.t{font-size:1.1rem;font-weight:900;margin:16px 0 10px;padding-left:10px;border-left:5px solid var(--teal)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cards{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.c{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:13px;box-shadow:0 8px 20px rgba(19,48,58,.06)}
.c b{display:block;font-size:1.6rem;font-weight:900;color:var(--teal-d);line-height:1.25}
.c span{font-size:.8rem;color:var(--mute);font-weight:700}
.c.o b{color:var(--sun-d)} .c.g b{color:var(--green)} .c.b b{color:var(--blue)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:13px;overflow:hidden;font-size:.88rem;box-shadow:0 8px 20px rgba(19,48,58,.06)}
th{background:var(--teal);color:#fff;text-align:left;padding:9px 11px;font-weight:800;white-space:nowrap}
td{padding:9px 11px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:#fafdfd}
.tw{overflow-x:auto}
.bar{height:9px;border-radius:999px;background:var(--tint);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.o i{background:var(--sun)}
.sub2{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;box-shadow:0 8px 20px rgba(19,48,58,.06)}
.sub2 .hd{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.tag{background:var(--sun);color:#fff;border-radius:999px;padding:2px 11px;font-size:.74rem;font-weight:800}
.tag.t{background:var(--teal)}
.tag.b{background:var(--blue)}
.who{font-weight:900}
.tm{font-size:.76rem;color:var(--mute);margin-left:auto}
.body{white-space:pre-wrap;font-size:.87rem;background:#fafdfd;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:300px;overflow:auto}
.body img,.sub2 img{max-width:100%;border-radius:10px}
.gline{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:8px;flex-wrap:wrap}
.gline .gn{font-weight:900;min-width:66px}
.gline .pt{font-size:1.3rem;font-weight:900;color:var(--teal-d);min-width:44px;text-align:center}
.gline .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.gline.t1{background:linear-gradient(100deg,#fdf0e4,#fbe0c4)}
.q{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}
.q .qq{font-weight:900;margin-bottom:7px}
.opt{display:flex;gap:9px;align-items:center;margin-bottom:5px;font-size:.87rem}
.opt .k{width:22px;height:22px;border-radius:50%;background:var(--tint);color:var(--teal-d);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:.76rem;flex:0 0 auto}
.opt .k.ok{background:var(--green);color:#fff}
.opt .lb{flex:1;min-width:120px}
.opt .pc{font-weight:900;color:var(--teal-d);width:62px;text-align:right}
.note{color:var(--mute);font-size:.85rem;margin:8px 0}
.wall{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.wn{background:#fff;border:1px solid var(--line);border-left:4px solid var(--sun);border-radius:12px;padding:11px 13px}
.wn .wb{font-size:.76rem;color:var(--mute);margin-top:6px}
#msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);background:var(--deep);color:#fff;padding:9px 19px;border-radius:999px;font-weight:800;opacity:0;transition:.22s;z-index:50;font-size:.88rem}
#msg.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1>🎛️ 講師後台　花蓮觀光旅宿 AI 專班<span class="sub">Day 1 打好底 · 10/27 F HOTEL 花蓮站前館</span></h1></div>
  <div class="sp">
    <input class="inp" id="cohort" style="width:140px" title="梯次">
    <button class="btn sm g" id="reload">🔄 重新整理</button>
    <a class="btn sm g" href="board.html" target="_blank" style="text-decoration:none">📺 投影</a>
  </div>
</div></header>

<div class="wrap">
  <div class="tabs">
    <button data-s="sum" class="on">📊 總覽</button>
    <button data-s="q10">🧭 自評表</button>
    <button data-s="sub">📤 交件</button>
    <button data-s="score">🏅 計分</button>
    <button data-s="quiz">❓ 互動題</button>
    <button data-s="warm">💬 暖身牆</button>
    <button data-s="list">👥 學員名單</button>
  </div>

  <section data-s="sum" class="on">
    <h2 class="t">今天的狀況</h2>
    <div class="cards" id="sumCards"></div>
    <h2 class="t">各組進度</h2>
    <div class="tw"><table id="sumTable"></table></div>
  </section>

  <section data-s="q10">
    <h2 class="t">AI 落點自評表：全班落點</h2>
    <div class="cards" id="q10Cards"></div>
    <h2 class="t">每一題「是」的比例</h2>
    <div class="tw"><table id="q10Items"></table></div>
    <h2 class="t">個別學員</h2>
    <div class="row"><button class="btn sm g" id="csvQ10">⬇️ 匯出 CSV</button></div>
    <div class="tw"><table id="q10Table"></table></div>
  </section>

  <section data-s="sub">
    <h2 class="t">交件</h2>
    <div class="row">
      <select class="inp" id="fTask">
        <option value="">全部模組</option>
        <option value="m1">模組一 自評與流程</option>
        <option value="m2">模組二 提示詞與指令卡</option>
        <option value="m3">模組三 內容</option>
        <option value="m4">模組四 FAQ 與 LINE</option>
        <option value="hw">回家作業一</option>
        <option value="extra">其他補充</option>
      </select>
      <select class="inp" id="fTeam"><option value="">全部組別</option></select>
      <button class="btn sm g" id="csvSub">⬇️ 匯出 CSV</button>
      <span class="note" id="subCount"></span>
    </div>
    <div id="subList"></div>
  </section>

  <section data-s="score">
    <h2 class="t">計分（兩天累計）</h2>
    <p class="note">交件數會自動計入。下面是講師手動加分，點一下就記一筆，可以重複點。按「撤銷」會扣掉最後一次加分。</p>
    <div id="scoreList"></div>
    <h2 class="t">加分紀錄</h2>
    <div class="row"><button class="btn sm g" id="csvScore">⬇️ 匯出 CSV</button></div>
    <div class="tw"><table id="scoreLog"></table></div>
  </section>

  <section data-s="quiz">
    <h2 class="t">互動題作答統計</h2>
    <div id="quizList"></div>
  </section>

  <section data-s="warm">
    <h2 class="t">暖身牆：一句話痛點</h2>
    <div class="row"><button class="btn sm g" id="csvWarm">⬇️ 匯出 CSV</button><span class="note" id="warmCount"></span></div>
    <div class="wall" id="warmWall"></div>
  </section>

  <section data-s="list">
    <h2 class="t">學員名單</h2>
    <div class="row"><button class="btn sm g" id="csvList">⬇️ 匯出 CSV</button><span class="note" id="listCount"></span></div>
    <div class="tw"><table id="listTable"></table></div>
  </section>
</div>

<div id="msg"></div>

<script>
(function(){
'use strict';
var SUPA='https://dpglkagtzdwiovzbtase.supabase.co';
var KEY='sb_publishable_Tuj9p4DXvO-jEqVcBnumTg_TqZ1NnRu';
var COURSE='hualien-hotel-ai';
var GROUPS=['第1組','第2組','第3組','第4組','第5組','第6組','第7組','第8組','第9組','第10組','第11組','第12組'];
var Q10=['用過生成式 AI 處理工作','有重複使用的提示詞','AI 文案不用大改就能用','清楚哪些資料不能貼給 AI','常見客服問題已整理成文字','LINE 有歡迎訊息與自動回應','每月整理一次評論','能匯出旅客名單','依客人類型發不同訊息','店裡有分工或 SOP'];
var ANS={q1:'B',q2:'B',q3:'A',q4:'C',q5:'B',q6:'B',q7:'C',q8:'A'};
var QT={q1:'不應該丟給免費 AI 的事',q2:'最不能直接用 AI 回答的',q3:'三種口吻配對',q4:'最缺 R-T-C-F 哪一段',q5:'最適合 Threads 的',q6:'最好的前 3 秒開場',q7:'一定要轉真人的',q8:'六段訊息 SOP 順序'};
var POLLNA={use:'目前有在用 AI 嗎',pay:'有花錢買 AI 嗎',cost:'每月大約花多少',fake:'破冰 2 真 1 假'};
var POLLOPT={
  use:[['A','有，工作上常用'],['B','有，偶爾用一下'],['C','還沒用過或很少用']],
  pay:[['A','只用免費版'],['B','有付費訂閱']],
  cost:[['A','沒有付費'],['B','約 US$20'],['C','US$100 以上']],
  fake:[['1','Podcast 100 集'],['2','虛擬貨幣 1 億美金'],['3','史瓦帝尼演講']]
};
var QOPT={q1:['A','B','C','D'],q2:['A','B','C','D'],q3:['A','B','C','D'],q4:['A','B','C','D'],q5:['A','B','C','D'],q6:['A','B','C','D'],q7:['A','B','C','D'],q8:['A','B','C','D']};
var TASKNA={m1:'模組一',m2:'模組二',m3:'模組三',m4:'模組四',hw:'作業一',warm:'暖身',extra:'補充'};
var PRESET=[['個人題答對',1],['團體第一',3],['團體第二',2],['團體第三',1],['發表 優',5],['發表 良',3],['準時交作業',3],['扣分',-1]];

function H(){return {apikey:KEY,Authorization:'Bearer '+KEY};}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
function q(s){return document.querySelector(s);}
function toast(m){var e=q('#msg');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},2200);}
function fmt(s){try{return new Date(s).toLocaleString('zh-TW',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function cohort(){return (q('#cohort').value||'').trim()||'hualien-1027';}
function csv(name,rows){
  var s=rows.map(function(r){return r.map(function(c){var v=String(c==null?'':c).replace(/"/g,'""');return /[",\n]/.test(v)?('"'+v+'"'):v;}).join(',');}).join('\r\n');
  var b=new Blob(['﻿'+s],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},800);
}

var D={students:[],subs:[],scores:[]};
async function get(path){
  var r=await fetch(SUPA+'/rest/v1/'+path,{headers:H()});
  if(!r.ok)throw new Error(r.status);
  return await r.json();
}
async function loadAll(){
  var c=cohort(), base='course=eq.'+encodeURIComponent(COURSE)+'&cohort=eq.'+encodeURIComponent(c);
  try{
    var a=await Promise.all([
      get('lw_line_students?'+base+'&select=code,name,office,quiz,commit_text,commit_checks,created_at&order=created_at.asc'),
      get('lw_workshop_submissions?'+base+'&select=id,team,submitter,task,kind,content,image_url,created_at&order=created_at.desc'),
      get('lw_workshop_scores?'+base+'&select=id,team,points,reason,created_at&order=created_at.desc')
    ]);
    D.students=a[0]||[];D.subs=a[1]||[];D.scores=a[2]||[];
    renderAll();
    toast('已更新：'+D.students.length+' 人報到、'+D.subs.length+' 筆交件');
  }catch(e){toast('讀取失敗：'+e.message);}
}

function teamOf(code){return String(code||'').split('｜')[0];}
function subsNoWarm(){return D.subs.filter(function(x){return x.task!=='warm';});}

/* ---- 總覽 ---- */
function renderSum(){
  var st=D.students, sub=subsNoWarm(), warm=D.subs.filter(function(x){return x.task==='warm';});
  var q10done=st.filter(function(s){var a=(s.quiz||{}).q10;return Array.isArray(a)&&a.filter(function(x){return x===0||x===1;}).length===10;}).length;
  var voted=st.filter(function(s){return (s.quiz||{}).vote;}).length;
  var ansAvg=st.length?(st.reduce(function(n,s){var qz=s.quiz||{};return n+Object.keys(ANS).filter(function(k){return qz[k]===ANS[k];}).length;},0)/st.length):0;
  q('#sumCards').innerHTML=[
    ['報到人數',st.length,''],['暖身牆',warm.length,'o'],['交件總數',sub.length,'g'],
    ['自評完成',q10done+' / '+st.length,'b'],['平均答對',(Math.round(ansAvg*10)/10)+' / 8',''],['投票人數',voted,'o']
  ].map(function(x){return '<div class="c '+x[2]+'"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>';}).join('');

  var bo={},up={},ppl={};
  D.scores.forEach(function(x){bo[x.team]=(bo[x.team]||0)+(+x.points||0);});
  sub.forEach(function(x){up[x.team]=(up[x.team]||0)+1;});
  st.forEach(function(s){var t=teamOf(s.code);ppl[t]=(ppl[t]||0)+1;});
  var rows=GROUPS.map(function(g){return {g:g,n:ppl[g]||0,u:up[g]||0,b:bo[g]||0,p:(up[g]||0)+(bo[g]||0)};});
  rows.sort(function(a,b2){return b2.p-a.p;});
  q('#sumTable').innerHTML='<tr><th>名次</th><th>組別</th><th>人數</th><th>交件</th><th>講師加分</th><th>總分</th></tr>'
    +rows.map(function(r,i){return '<tr><td>'+(i+1)+(i===0&&r.p>0?' 🏆':'')+'</td><td><b>'+r.g+'</b></td><td>'+r.n+'</td><td>'+r.u+'</td><td>'+(r.b>0?'+':'')+r.b+'</td><td><b>'+r.p+'</b></td></tr>';}).join('');
}

/* ---- 自評表 ---- */
function stageOf(sum){return sum<=3?0:(sum<=7?1:2);}
function renderQ10(){
  var rows=D.students.map(function(s){
    var a=((s.quiz||{}).q10)||[], done=a.filter(function(x){return x===0||x===1;}).length;
    var sum=a.filter(function(x){return x===1;}).length;
    return {code:s.code,name:s.name,shop:s.office,done:done,sum:sum,st:done===10?stageOf(sum):-1,
      flow:(s.quiz||{}).flow||'',success:s.commit_text||'',type:(s.quiz||{}).type||'',a:a};
  });
  var fin=rows.filter(function(r){return r.done===10;});
  var cnt=[0,0,0]; fin.forEach(function(r){cnt[r.st]++;});
  var avg=fin.length?(fin.reduce(function(n,r){return n+r.sum;},0)/fin.length):0;
  q('#q10Cards').innerHTML=[
    ['完成自評',fin.length+' 人',''],['平均分數',(Math.round(avg*10)/10)+' 分','o'],
    ['階段一 基礎',cnt[0]+' 人','b'],['階段二 中階',cnt[1]+' 人','g'],['階段三 整合',cnt[2]+' 人','']
  ].map(function(x){return '<div class="c '+x[2]+'"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>';}).join('');

  var per=Q10.map(function(t,i){
    var yes=fin.filter(function(r){return r.a[i]===1;}).length;
    return {t:t,yes:yes,pct:fin.length?Math.round(yes/fin.length*100):0};
  });
  per.sort(function(a,b2){return a.pct-b2.pct;});
  q('#q10Items').innerHTML='<tr><th>題目（由低到高）</th><th>回答「是」</th><th>比例</th></tr>'
    +per.map(function(x){return '<tr><td>'+esc(x.t)+'</td><td>'+x.yes+' / '+fin.length+'</td><td><div class="bar'+(x.pct<40?' o':'')+'"><i style="width:'+x.pct+'%"></i></div>'+x.pct+'%</td></tr>';}).join('');

  var FN={social:'社群內容',cs:'訂房客服',review:'評論回覆',winback:'淡季回客'};
  var SN=['基礎應用','中階實作','流程整合'];
  rows.sort(function(a,b2){return b2.sum-a.sum;});
  q('#q10Table').innerHTML='<tr><th>組別</th><th>姓名</th><th>店名</th><th>分數</th><th>階段</th><th>要改善的流程</th><th>成功的樣子</th></tr>'
    +rows.map(function(r){return '<tr><td>'+esc(teamOf(r.code))+'</td><td><b>'+esc(r.name||'')+'</b></td><td>'+esc(r.shop||'')+'</td>'
      +'<td>'+(r.done===10?(r.sum+' / 10'):('未完成 '+r.done+'/10'))+'</td><td>'+(r.st>=0?SN[r.st]:'')+'</td>'
      +'<td>'+esc(FN[r.flow]||'')+'</td><td>'+esc(r.success||'')+'</td></tr>';}).join('');
  q('#csvQ10').onclick=function(){
    csv('自評表_'+cohort()+'.csv',[['組別','姓名','店名','分數','階段','流程','成功的樣子']].concat(
      rows.map(function(r){return [teamOf(r.code),r.name,r.shop,r.done===10?r.sum:'',r.st>=0?SN[r.st]:'',FN[r.flow]||'',r.success];})));
  };
}

/* ---- 交件 ---- */
function renderSub(){
  var t=q('#fTask').value, g=q('#fTeam').value;
  var rows=subsNoWarm().filter(function(x){return (!t||x.task===t)&&(!g||x.team===g);});
  q('#subCount').textContent='共 '+rows.length+' 筆';
  q('#subList').innerHTML=rows.length?rows.map(function(x){
    var body=(x.kind==='image')
      ? '<a href="'+esc(x.image_url)+'" target="_blank" rel="noopener"><img src="'+esc(x.image_url)+'" loading="lazy" alt="交件"></a>'
      : '<div class="body">'+esc(x.content||'')+'</div>';
    return '<div class="sub2"><div class="hd"><span class="tag'+(x.task==='hw'?' b':(/^m/.test(x.task)?' t':''))+'">'+esc(TASKNA[x.task]||x.task)+'</span>'
      +'<span class="who">'+esc(x.team||'')+'　'+esc(x.submitter||'')+'</span><span class="tm">'+fmt(x.created_at)+'</span></div>'+body+'</div>';
  }).join(''):'<p class="note">這個條件下還沒有交件。</p>';
  q('#csvSub').onclick=function(){
    csv('交件_'+cohort()+'.csv',[['時間','組別','姓名','項目','型態','內容或圖片']].concat(
      rows.map(function(x){return [fmt(x.created_at),x.team,x.submitter,TASKNA[x.task]||x.task,x.kind,x.kind==='image'?x.image_url:x.content];})));
  };
}

/* ---- 計分 ---- */
async function addScore(team,points,reason){
  try{
    var r=await fetch(SUPA+'/rest/v1/lw_workshop_scores',{method:'POST',
      headers:Object.assign(H(),{'Content-Type':'application/json',Prefer:'return=minimal'}),
      body:JSON.stringify({course:COURSE,cohort:cohort(),team:team,points:points,reason:reason})});
    if(!r.ok)throw new Error(r.status);
    toast(team+' '+(points>0?'+':'')+points+'（'+reason+'）');
    await loadAll();
  }catch(e){toast('加分失敗：'+e.message);}
}
async function undoScore(team){
  var last=D.scores.filter(function(x){return x.team===team;})[0];
  if(!last){toast(team+' 沒有加分紀錄');return;}
  try{
    var r=await fetch(SUPA+'/rest/v1/lw_workshop_scores?id=eq.'+last.id,{method:'DELETE',headers:H()});
    if(!r.ok)throw new Error(r.status);
    toast('已撤銷 '+team+' 的 '+(last.points>0?'+':'')+last.points);
    await loadAll();
  }catch(e){toast('撤銷失敗：'+e.message);}
}
function renderScore(){
  var bo={},up={};
  D.scores.forEach(function(x){bo[x.team]=(bo[x.team]||0)+(+x.points||0);});
  subsNoWarm().forEach(function(x){up[x.team]=(up[x.team]||0)+1;});
  var arr=GROUPS.map(function(g){return {g:g,b:bo[g]||0,u:up[g]||0,p:(bo[g]||0)+(up[g]||0)};});
  var max=Math.max.apply(null,arr.map(function(a){return a.p;}));
  q('#scoreList').innerHTML=arr.map(function(a){
    return '<div class="gline'+(max>0&&a.p===max?' t1':'')+'"><span class="gn">'+a.g+'</span><span class="pt">'+a.p+'</span>'
      +'<span class="note" style="margin:0">交件 '+a.u+' · 講師 '+(a.b>0?'+':'')+a.b+'</span>'
      +'<span class="acts">'+PRESET.map(function(p){
        return '<button class="btn sm '+(p[1]<0?'r':(p[1]>=3?'o':'g'))+'" data-g="'+a.g+'" data-p="'+p[1]+'" data-r="'+p[0]+'">'+(p[1]>0?'+':'')+p[1]+' '+p[0]+'</button>';
      }).join('')+'<button class="btn sm g" data-undo="'+a.g+'">↩︎ 撤銷</button></span></div>';
  }).join('');
  q('#scoreLog').innerHTML='<tr><th>時間</th><th>組別</th><th>分數</th><th>原因</th></tr>'
    +(D.scores.length?D.scores.map(function(x){return '<tr><td>'+fmt(x.created_at)+'</td><td>'+esc(x.team)+'</td><td>'+(x.points>0?'+':'')+x.points+'</td><td>'+esc(x.reason||'')+'</td></tr>';}).join('')
      :'<tr><td colspan="4">還沒有加分紀錄</td></tr>');
  q('#csvScore').onclick=function(){
    csv('加分紀錄_'+cohort()+'.csv',[['時間','組別','分數','原因']].concat(D.scores.map(function(x){return [fmt(x.created_at),x.team,x.points,x.reason];})));
  };
}

/* ---- 互動題 ---- */
function renderQuiz(){
  var st=D.students;
  var html='';
  ['fake','use','pay','cost'].forEach(function(k){
    var agg={},n=0;
    st.forEach(function(s){var v=(s.quiz||{})[k];if(v){agg[v]=(agg[v]||0)+1;n++;}});
    html+='<div class="q"><div class="qq">'+esc(POLLNA[k])+'　<span class="note">'+n+' 人作答</span></div>'
      +(POLLOPT[k]||[]).map(function(o){
        var c=agg[o[0]]||0,pct=n?Math.round(c/n*100):0;
        return '<div class="opt"><span class="k">'+o[0]+'</span><span class="lb">'+esc(o[1])+'</span><div class="bar" style="flex:1"><i style="width:'+pct+'%"></i></div><span class="pc">'+c+' 人 '+pct+'%</span></div>';
      }).join('')+'</div>';
  });
  Object.keys(ANS).forEach(function(k){
    var agg={},n=0,right=0;
    st.forEach(function(s){var v=(s.quiz||{})[k];if(v){agg[v]=(agg[v]||0)+1;n++;if(v===ANS[k])right++;}});
    html+='<div class="q"><div class="qq">'+k.toUpperCase()+'　'+esc(QT[k])+'　<span class="note">'+n+' 人作答，答對 '+right+' 人（'+(n?Math.round(right/n*100):0)+'%）</span></div>'
      +QOPT[k].map(function(o){
        var c=agg[o]||0,pct=n?Math.round(c/n*100):0,ok=(o===ANS[k]);
        return '<div class="opt"><span class="k'+(ok?' ok':'')+'">'+o+'</span><span class="lb">'+(ok?'<b>正解</b>':'')+'</span><div class="bar'+(ok?'':' o')+'" style="flex:1"><i style="width:'+pct+'%"></i></div><span class="pc">'+c+' 人 '+pct+'%</span></div>';
      }).join('')+'</div>';
  });
  q('#quizList').innerHTML=html;
}

/* ---- 暖身牆 ---- */
function renderWarm(){
  var rows=D.subs.filter(function(x){return x.task==='warm';});
  q('#warmCount').textContent='共 '+rows.length+' 則';
  q('#warmWall').innerHTML=rows.length?rows.map(function(x){
    return '<div class="wn"><div>'+esc(x.content||'')+'</div><div class="wb">'+esc(x.team||'')+' · '+esc(x.submitter||'')+' · '+fmt(x.created_at)+'</div></div>';
  }).join(''):'<p class="note">還沒有人貼。</p>';
  q('#csvWarm').onclick=function(){
    csv('暖身牆_'+cohort()+'.csv',[['時間','組別','姓名','內容']].concat(rows.map(function(x){return [fmt(x.created_at),x.team,x.submitter,x.content];})));
  };
}

/* ---- 名單 ---- */
function renderList(){
  var st=D.students.slice();
  st.sort(function(a,b2){return String(a.code).localeCompare(String(b2.code),'zh-Hant');});
  q('#listCount').textContent='共 '+st.length+' 人';
  var SN=['基礎','中階','整合'];
  q('#listTable').innerHTML='<tr><th>組別</th><th>姓名</th><th>店名</th><th>業態</th><th>角色</th><th>自評</th><th>答對</th><th>投票</th><th>報到時間</th></tr>'
    +st.map(function(s){
      var qz=s.quiz||{},a=qz.q10||[],done=a.filter(function(x){return x===0||x===1;}).length,sum=a.filter(function(x){return x===1;}).length;
      var right=Object.keys(ANS).filter(function(k){return qz[k]===ANS[k];}).length;
      return '<tr><td>'+esc(teamOf(s.code))+'</td><td><b>'+esc(s.name||'')+'</b></td><td>'+esc(s.office||'')+'</td>'
        +'<td>'+esc(qz.type||'')+'</td><td>'+esc(qz.role||'')+'</td>'
        +'<td>'+(done===10?(sum+' 分 '+SN[stageOf(sum)]):(done?('未完成 '+done+'/10'):''))+'</td>'
        +'<td>'+right+' / 8</td><td>'+esc(qz.vote||'')+'</td><td>'+fmt(s.created_at)+'</td></tr>';
    }).join('');
  q('#csvList').onclick=function(){
    csv('學員名單_'+cohort()+'.csv',[['組別','姓名','店名','業態','角色','自評分數','階段','答對題數','投票','報到時間']].concat(
      st.map(function(s){
        var qz=s.quiz||{},a=qz.q10||[],done=a.filter(function(x){return x===0||x===1;}).length,sum=a.filter(function(x){return x===1;}).length;
        return [teamOf(s.code),s.name,s.office,qz.type||'',qz.role||'',done===10?sum:'',done===10?SN[stageOf(sum)]:'',
          Object.keys(ANS).filter(function(k){return qz[k]===ANS[k];}).length,qz.vote||'',fmt(s.created_at)];
      })));
  };
}

function renderAll(){
  if(!q('#fTeam').options.length||q('#fTeam').options.length===1){
    q('#fTeam').innerHTML='<option value="">全部組別</option>'+GROUPS.map(function(g){return '<option>'+g+'</option>';}).join('');
  }
  renderSum();renderQ10();renderSub();renderScore();renderQuiz();renderWarm();renderList();
}

/* ---- 事件 ---- */
document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b);});
    document.querySelectorAll('section').forEach(function(s){s.classList.toggle('on',s.getAttribute('data-s')===b.getAttribute('data-s'));});
  });
});
q('#reload').addEventListener('click',loadAll);
q('#cohort').addEventListener('change',loadAll);
q('#fTask').addEventListener('change',renderSub);
q('#fTeam').addEventListener('change',renderSub);
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-p]');
  if(b){addScore(b.getAttribute('data-g'),+b.getAttribute('data-p'),b.getAttribute('data-r'));return;}
  var u=e.target.closest('[data-undo]');
  if(u){undoScore(u.getAttribute('data-undo'));return;}
});
q('#cohort').value=(new URLSearchParams(location.search).get('c')||'hualien-1027');
loadAll();
setInterval(loadAll,30000);
})();
</script>
